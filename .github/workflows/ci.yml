name: CI

# Roda em todo push na main e em todo Pull Request contra a main —
# assim, ninguém consegue mergear código quebrado sem perceber.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o código do repositório
        uses: actions/checkout@v4

      - name: Configura Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Builda a imagem e exporta como .tar
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: contra-zap-game-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          outputs: type=docker,dest=/tmp/contra-zap-image.tar

      - name: Guarda a imagem pros outros jobs baixarem
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/contra-zap-image.tar
          retention-days: 1

  test:
    name: Testes automatizados
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Baixa o código do repositório
        uses: actions/checkout@v4

      - name: Configura Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instala dependências
        run: npm ci

      - name: Roda os testes
        run: npm test

  docs:
    name: Documentação de API
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Baixa o código do repositório
        uses: actions/checkout@v4

      - name: Configura Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Valida o OpenAPI (rotas HTTP)
        run: npx --yes @redocly/cli@1 lint docs/openapi.yaml

      - name: Valida o AsyncAPI (protocolo socket.io)
        run: npx --yes @asyncapi/cli@2 validate docs/asyncapi.yaml

      - name: Instala dependências
        run: npm ci --ignore-scripts

      - name: Sobe o servidor e espera ficar saudável
        run: |
          node Server.js &
          echo $! > /tmp/servidor.pid
          for tentativa in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Servidor no ar após $tentativa tentativa(s)."
              exit 0
            fi
            sleep 1
          done
          echo "O servidor não respondeu em /health depois de 30s."
          exit 1

      - name: Roda a coleção do Postman (Newman)
        run: npx --yes newman@6 run postman/Contra-Zap.postman_collection.json --env-var baseUrl=http://localhost:3000

      - name: Derruba o servidor
        if: always()
        run: kill "$(cat /tmp/servidor.pid)" || true

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Baixa o código do repositório
        uses: actions/checkout@v4

      - name: Configura Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Só as dependências da raiz (Playwright em si + helpers de teste).
      # NÃO precisa mais instalar/buildar public/app aqui — o front já vem
      # pronto DENTRO da imagem Docker que vamos rodar (ver abaixo).
      - name: Instala dependências
        run: npm ci --ignore-scripts

      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Baixa a imagem Docker buildada
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Carrega a imagem no Docker local
        run: docker load -i /tmp/contra-zap-image.tar

      # Roda a imagem exatamente como ela sairia pra produção, com três
      # sobrescritas necessárias só pro E2E:
      #  - NODE_ENV=test (não "production"): a imagem pula o seed de
      #    banco.json em produção de propósito (contas fixture nunca podem
      #    nascer em prod) — mas o E2E depende desse seed pra testar login
      #    em conta existente (henrique/123 etc.)
      #  - DB_PATH próprio: nunca reusa o banco.sqlite de quem tá
      #    desenvolvendo
      #  - tetos de rate limit afrouxados: a suíte inteira sai de
      #    127.0.0.1, estouraria o limite de produção só de existir
      - name: Sobe o container e espera ficar saudável
        run: |
          docker run -d --name contra-zap-e2e -p 3100:3000 \
            -e NODE_ENV=test \
            -e PORT=3000 \
            -e DB_PATH=/tmp/banco-e2e.sqlite \
            -e JWT_SECRET=segredo-de-teste-e2e-contra-zap \
            -e VERIFICAR_NOME_MAX=100000 \
            -e ENTRAR_MAX=100000 \
            -e CADASTRAR_MAX=100000 \
            contra-zap-game-server:${{ github.sha }}
          for tentativa in $(seq 1 30); do
            if curl -sf http://localhost:3100/health > /dev/null; then
              echo "Container no ar após $tentativa tentativa(s)."
              exit 0
            fi
            sleep 1
          done
          echo "O container não respondeu em /health depois de 30s."
          docker logs contra-zap-e2e
          exit 1

      # E2E_SERVIDOR_EXTERNO=true diz pro playwright.config.js pra NÃO
      # tentar subir servidor nenhum — o container acima já está de pé.
      - name: Roda o E2E contra o container
        run: npm run test:e2e
        env:
          E2E_SERVIDOR_EXTERNO: "true"

      - name: Mostra os logs do container (sempre, ajuda a debugar falha)
        if: always()
        run: docker logs contra-zap-e2e

      - name: Derruba o container
        if: always()
        run: docker rm -f contra-zap-e2e || true

      - name: Guarda o relatório quando falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7